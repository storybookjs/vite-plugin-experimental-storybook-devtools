<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storybook DevTools</title>
  <script>
    // Assets are relative to the mount base ('./'), so a URL without the
    // trailing slash resolves them against the parent path and 404s
    // (e.g. behind hosts that rewrite or strip trailing slashes). One-shot:
    // a host that force-strips the slash again (Next's 308) must not loop.
    if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) {
      var k = '__sbdt-slash-retry'
      var tried = false
      try { tried = sessionStorage.getItem(k) === location.pathname; if (!tried) sessionStorage.setItem(k, location.pathname) } catch (e) {}
      if (!tried) location.replace(location.pathname + '/' + location.search + location.hash)
    } else {
      try { sessionStorage.removeItem('__sbdt-slash-retry') } catch (e) {}
    }
  </script>
  <link rel="stylesheet" href="./panel.css">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./panel.ts"></script>
</body>
</html>
